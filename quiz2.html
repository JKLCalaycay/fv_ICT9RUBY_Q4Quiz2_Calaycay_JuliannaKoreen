<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>QUIZ2Q4</title>

	<style>
		.row {
			display: flex;
	        
	        justify-content: center;	
		}

		img {
			width: 350px;
			height: 500px;
			border: #36454F ridge 10px;
		}

		body {
			background-image: url(https://i.pinimg.com/736x/86/90/c2/8690c2945ebc1fdb702810634a86014e.jpg);
			background-repeat: no-repeat;
			background-size: cover;
		}

		h1 {
			color: #946b2d;
			font-family: fantasy;
			font-size: 60px;
		}

		h2 {
			color: 	#946b2d;
			background-color: #000000;
			font-family: fantasy;
			font-weight: bold;
		}

		details {
			color: #946b2d;
		}

		p {
			color: #946b2d;
			font-family: fantasy;
			font-weight: bolder;
			font-size: 30px;
			background-color: black;
		}

		a {
			color: white;
		}

	</style>
</head>
<body>

<center>

	<br><br>

	<h1>ℜ𝔞𝔳𝔢𝔫𝔠𝔩𝔞𝔴</h1>

	<h2>𖦹 Score Analyzer .𖥔</h2>

	<details ontoggle="instructions()">
		<summary>Instructions</summary>
		<i id="show"></i>
	</details>

	<br>

	<div class="columns">
		<div class="row">
			<div class="col-md-3">

				<img src="https://i.pinimg.com/736x/d6/64/a9/d664a94bcebf5af41e87e2cba35d00c9.jpg">

				<br><br>

				<p>Science: ⚜ </p>
				<input type="text" class="form-control" id="English">
			</div>
			<div class="col-md-3">

				<img src="https://i.pinimg.com/736x/00/28/68/0028688b62fb9885d58fbb0672f70999.jpg">

				<br><br>

				<p>Math: ⚜ </p>
				<input type="text" class="form-control" id="Math">
			</div>

			<div class="col-md-3">

				<img src="https://i.pinimg.com/736x/6a/55/9d/6a559dbfa4aefecb8153442a68e939a9.jpg">

				<br><br>

				<p>English: ⚜ </p>
				<input type="text" class="form-control" id="Science">
			</div>
		</div>
	</div>

	<br>

	<button type="Submit" class="btn btn-dark" onclick="calc()" style=" color: #946b2d; font-size: 25px; font-family: fantasy;">Calculate</button>
	

	<script>

		function calc(){

        var Eng = Number(document.getElementById("English").value);
		var Mat = Number(document.getElementById("Math").value);
		var Sci = Number(document.getElementById("Science").value);
		var gradesum= (Eng + Mat + Sci) / 3;
		let gradesummary = Math.round(gradesum * 100) / 100;

		switch(true){
			case (gradesum <= 74.99):
			alert("Your average is " + gradesummary + ". It is poor, are you sure your from Ravenclaw?");
			break;

			case (gradesum >= 75 && gradesum <= 79.99):
			alert("Your average is " + gradesummary + ". It Needs Improvement.");
			break;

			case (gradesum >= 80 && gradesum <= 86.99):
			alert("Your average is " + gradesummary + ". It is satisfactory for Ravenclaw.");
			break;

			case (gradesum >= 87 && gradesum <= 93.99):
			alert("Your average is " + gradesummary + ". It is above satisfactory, goodjob.");
			break;

			case (gradesum >= 94 && gradesum <= 100):
			alert("Your average is " + gradesummary + ". Excellent! Wit beyond measure is a man's greatest treasure.");
			break;

			default :
			alert("Something went wrong, please try again.");
		
		}
	}
	</script>

	<script>
		function instructions(){
			document.getElementById("show").innerHTML="Enter your grades per subject and press 'see your score'";
		}
	</script>

	<br><br><br>

    <a href="https://docs.google.com/document/d/1GpUgfJQdvrYbKOygsKrxFKBb2qjYcpDZGYvjQ6A3o1I/edit?usp=sharing">References!</a>


</center>


</body>
</html>
